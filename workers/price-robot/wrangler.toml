# Price robot: Cloudflare Worker (Free plan). See docs/PRICE-ROBOT-DESIGN.md.
name = "price-robot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Must match REFRESH_CRON / WATCHDOG_CRON in src/crons.ts. Times are UTC:
# every minute 13:00–21:59 on weekdays covers 9:30–16:00 New York time in
# summer and winter; each run checks the real trading calendar before
# making any price call. Each run makes at most 45 Finnhub calls (60/min limit).
[triggers]
crons = ["* 13-21 * * 1-5", "*/5 * * * *"]

[[kv_namespaces]]
binding = "PRICES"
# Created with `npx wrangler kv namespace create PRICES` on the production
# Cloudflare account. `wrangler dev` uses a local store and ignores it.
id = "fb90b84df3984689bcf657762decfc77"

[vars]
# Web origins allowed to read prices from a browser (comma-separated; "*"
# matches one hostname label part, for Vercel preview URLs). localhost is
# always allowed. Native apps send no Origin and aren't affected.
ALLOWED_ORIGINS = "https://investiq-web-blond.vercel.app,https://investmentapp-*-malik-c31f.vercel.app"

# Secrets (never in this file): FINNHUB_KEY (a dedicated server-only key,
# never the one the app used to carry) and ALERT_URL. Set with
# `npx wrangler secret put <NAME>`. Alpaca is disabled: no Alpaca secrets.
